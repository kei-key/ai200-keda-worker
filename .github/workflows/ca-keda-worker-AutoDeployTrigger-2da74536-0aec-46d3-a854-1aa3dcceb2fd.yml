name: Trigger auto deployment for ca-keda-worker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAKEDAWORKER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAKEDAWORKER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAKEDAWORKER_AZURE_SUBSCRIPTION_ID }}

      - name: Docker Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: acraikeda001.azurecr.io
          username: ${{ secrets.CAKEDAWORKER_REGISTRY_USERNAME }}
          password: ${{ secrets.CAKEDAWORKER_REGISTRY_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t acraikeda001.azurecr.io/keda-worker:${{ github.sha }} .
          docker push acraikeda001.azurecr.io/keda-worker:${{ github.sha }}

      - name: Deploy to Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ca-keda-worker \
              --resource-group rg-ai200-keda \
              --image acraikeda001.azurecr.io/keda-worker:${{ github.sha }}
